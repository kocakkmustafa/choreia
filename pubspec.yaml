name: choreia
description: Choreia — Learn to Dance. Camera-based dance coaching, on device.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # The engine is a SEPARATE package with no Flutter dependency (M-F-160,
  # JabLab's split mirrored): scoring logic must stay testable without a widget
  # tree, and the shell must not be able to reach into it sideways.
  choreia_engine:
    path: packages/choreia_engine

  # SessionStore now comes from the core, not from a local port (M-F-193
  # three-consumers rule): Choreia was the SECOND consumer, Lissom the third,
  # so the shape was promoted and the local copy deleted. Two-pin regime
  # (M-F-154): Dart consumers pin a TAG.
  #
  # The app depends on it DIRECTLY rather than re-exporting through
  # choreia_engine: the engine judges cycles and has no business knowing that
  # sessions are stored at all.
  # PIN ÇİFTİ — İKİSİ DE TEK REF (`f13bdc9`), tag DEĞİL (J-071/M-F-260).
  #
  # `motion_core-v0.11.0` tag'i `2018469`'da, `motion_camera-v0.1.2` tag'i
  # `f13bdc9`'da duruyor. AYNI repodan iki paketi İKİ FARKLI commit'ten
  # pinlemek pub'da çift-kaynak çatışması üretir, o yüzden ikisi de bu tek
  # commit'ten geliyor: `f13bdc9`, `2018469`'un ARDILI (ölçüldü:
  # `merge-base --is-ancestor`) ve orada motion_core 0.11.0 · motion_camera
  # 0.1.2 sürümlerini taşıyor. Eşitlik `test/pin_equality_test.dart` ile
  # ÇİVİLİ — iki ref ayrışırsa test düşer.
  motion_core:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_core
      ref: f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d

  # Kamera köprüsü: motor `motion_core`'dan hiçbir şey import etmiyordu ve
  # pini C-121'de DÜŞÜRÜLMÜŞTÜ, isimli geri-giriş tetiğiyle: "ilk gerçek
  # import günü". BUGÜN O GÜN — canlı yol PoseFrame/JointAngles/segmentasyon
  # kullanıyor.
  motion_camera:
    git:
      url: https://github.com/kocakkmustafa/motion-core.git
      path: packages/motion_camera
      ref: f13bdc93b2eae2f741bfcdb4c9270a88e5d75e5d

  # Only to locate the app-private directory. The storage FORMAT is the core's
  # (append-only JSONL) — a 3rd-party DB is deliberately absent: session
  # history is an event stream with no query load, and that need is met when it
  # is MEASURED, not anticipated (J-064).
  path_provider: ^2.1.0

  # Design pass (2026-08-06): the three faces the design brief names
  # (Instrument Serif, Manrope, IBM Plex Mono) are not system fonts, and
  # neither LifeOS nor Burun Farkı — the two other apps in this workspace
  # already shipping this package — bundle them locally either. Same choice
  # here rather than a new precedent: no Motion sibling had solved this yet
  # (first giydirme turn), flagged in the report so the family can pick a
  # single answer once, not five times.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # Content is versioned JSON the engine interprets at runtime (plan §7):
    # a new style is a content pack, not a code change.
    - content/
    # References are listed FILE BY FILE, not as a directory, because that
    # directory also holds build-time bookkeeping that must not ship:
    # `decisions.json` is an INPUT to build_reference.py (its contents are
    # already injected into the artifacts below) and `.keyset-baseline.json` is
    # the field-loss gate's baseline. A directory entry would bundle both into
    # the app for no runtime reader. Adding a reference means adding a line
    # here — and a forgotten line fails loudly at load, which is the failure
    # direction to prefer.
    - content/references/hh_bounce.json
    - content/references/hh_roger_rabbit.json
    - content/references/hh_running_man.json
    - content/references/ss_shine_footwork.json
    - content/styles/salsa_shines/
    - content/styles/salsa_shines/steps/
    - content/styles/hip_hop_foundations/
    - content/styles/hip_hop_foundations/steps/
